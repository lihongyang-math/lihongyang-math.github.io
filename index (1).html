<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lihong Yang — Papers</title>
<style>
  :root { color-scheme: light; }
  body { max-width: 850px; margin: 52px auto; padding: 0 22px; font-family: Georgia, 'Times New Roman', serif; font-size: 17px; line-height: 1.6; color: #171717; background: white; }
  h1 { font-size: 2rem; font-weight: normal; margin: 0 0 12px; }
  .affiliations { margin: 0 0 18px; }
  .affiliations p { margin: 0 0 10px; }
  .contact { margin: 0 0 26px; }
  a { color: #124d98; }
  a:hover { text-decoration: underline; }
  nav { display: flex; flex-wrap: wrap; column-gap: 19px; row-gap: 9px; align-items: baseline; border-bottom: 1px solid #aaa; padding-bottom: 10px; margin-bottom: 22px; }
  nav button { font: inherit; color: #124d98; background: transparent; border: 0; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  nav button[aria-selected="true"] { color: #111; font-weight: bold; text-decoration: none; }
  nav button:focus-visible { outline: 2px solid #124d98; outline-offset: 4px; }
  h2 { font-size: 1.3rem; font-weight: normal; margin: 0 0 16px; }
  ol { padding-left: 27px; margin: 0; }
  li { padding-left: 4px; margin-bottom: 17px; }
  .paper-title { font-style: italic; }
  .venue { color: #333; }
  .status { color: #555; }
  footer { border-top: 1px solid #ddd; margin-top: 36px; padding-top: 12px; font-size: 0.85rem; color: #777; }
  @media(max-width: 600px) { body { margin: 25px auto; font-size: 16px; } h1 { font-size: 1.8rem; } nav { column-gap: 14px; } }
</style>
</head>
<body>
<header>
  <h1>Lihong Yang</h1>
  <div class="affiliations">
    <p>Institut de Recherche Mathématique Avancée (IRMA)<br>Université de Strasbourg, France</p>
    <p>Institute for Advanced Study in Mathematics<br>Harbin Institute of Technology, China</p>
  </div>
  <p class="contact">Email: <span>[your academic email]</span></p>
</header>
<main>
  <nav id="paper-filters" aria-label="Filter publications by topic">
    <button type="button" data-filter="all" aria-selected="true">Papers</button>
    <button type="button" data-filter="core">Core partitions</button>
    <button type="button" data-filter="permutation">Permutation Statistics</button>
  </nav>
  <section aria-live="polite" aria-atomic="true">
    <h2 id="list-title">All papers</h2>
    <ol id="paper-list"></ol>
  </section>
</main>
<footer>Last updated: October 2026</footer>
<script>
// Add new entries here. All views are automatically sorted newest first.
// Give each paper one or more topic codes: 'core', 'permutation'.
const papers = [
  {
    year: 2026, date: '2026-01-01',
    title: 'A self-conjugate partition analog of (t, t+1)-core partitions with distinct parts',
    authors: 'H. Xiong and L. Yang',
    venue: 'European Journal of Combinatorics 133 (2026), 104322',
    topics: ['core'],
    url: '' // Optional: add paper DOI or arXiv URL
  },
  {
    year: 2023, date: '2023-01-01',
    title: 'Further extensions of Haglund–Remmel–Wilson identity',
    authors: 'S. H. F. Yan, S. Ling, L. Yang and R. D. P. Zhou',
    venue: 'Advances in Applied Mathematics 144 (2023), 102459',
    topics: ['permutation'],
    url: ''
  }
];
const topicLabels = {all:'All papers', core:'Core partitions', permutation:'Permutation Statistics'};
function renderPapers(filter='all') {
  document.querySelectorAll('#paper-filters button').forEach(button => {
    button.setAttribute('aria-selected', String(button.dataset.filter === filter));
  });
  document.getElementById('list-title').textContent = topicLabels[filter];
  const list = document.getElementById('paper-list');
  list.replaceChildren();
  const matching = papers.filter(paper => filter === 'all' || paper.topics.includes(filter))
    .sort((a,b) => b.date.localeCompare(a.date) || b.year-a.year || a.title.localeCompare(b.title));
  for(const paper of matching) {
    const item = document.createElement('li');
    const authors = document.createElement('span'); authors.textContent = paper.authors + ', ';
    const title = document.createElement(paper.url ? 'a' : 'span');
    title.className = 'paper-title'; title.textContent = paper.title;
    if(paper.url) { title.href = paper.url; title.target='_blank'; title.rel='noopener noreferrer'; }
    const venue = document.createElement('span'); venue.className = 'venue'; venue.textContent = ', ' + paper.venue + '.';
    item.append(authors, title, venue); list.append(item);
  }
}
document.getElementById('paper-filters').addEventListener('click', event => {
  const button = event.target.closest('button[data-filter]');
  if(button) renderPapers(button.dataset.filter);
});
renderPapers();
</script>
</body>
</html>
